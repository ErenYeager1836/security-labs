[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-app-lab"
version = "0.1.0"
description = "Educational vulnerability lab demonstrating SQLi, XSS, IDOR, and SSRF in vulnerable vs fixed versions"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nithishvelan M", email = "erenyeager1836@users.noreply.github.com" }
]
keywords = ["security", "appsec", "owasp", "sqli", "xss", "idor", "ssrf", "flask", "lab"]
dependencies = [
    "flask>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
vuln-app-lab = "app:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]

name: Security Labs CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  port-scanner-cpp:
    name: Build & Test port-scanner (C++17)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build -S port-scanner

      - name: Build C++ Targets
        run: cmake --build build --config Release

      - name: Run port-scanner Test Suite
        run: ctest --test-dir build -C Release --output-on-failure

  python-security-tools:
    name: Test & Lint Python Tools (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest flask bcrypt argon2-cffi

      - name: Lint Python Codebase
        run: |
          # Stop build on syntax errors or undefined names
          flake8 log-analyzer hardening-auditor dependency-checker vuln-app-lab password-demo \
            --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Test log-analyzer
        run: pytest log-analyzer/tests -v

      - name: Test hardening-auditor
        run: pytest hardening-auditor/tests -v

      - name: Test dependency-checker
        run: pytest dependency-checker/tests -v

      - name: Test vuln-app-lab
        run: pytest vuln-app-lab/tests -v

      - name: Test password-demo
        run: pytest password-demo/tests -v

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dependency-checker"
version = "0.1.0"
description = "Software supply chain vulnerability checker for Python (requirements.txt) and Java (pom.xml) using OSV.dev API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Nithishvelan M", email = "erenyeager1836@users.noreply.github.com" }
]
keywords = ["security", "sbom", "supply-chain", "vulnerabilities", "cve", "osv", "dependencies"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dependency-checker = "dependency_checker.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
